name: Update candles
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candles
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - run: python update_candles.py
      - name: Save new candles
        run: |
          git config user.name "candle-bot"
          git config user.email "candle-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update candles" && git push)
